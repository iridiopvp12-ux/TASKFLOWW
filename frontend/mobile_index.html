<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskFlow Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css"> <!-- Base styles (variables) -->
    <link rel="stylesheet" href="css/mobile.css">
    <!-- Reuse specific styles if needed, but be careful of desktop layout overrides -->
</head>
<body>

    <div id="toast-container"></div>

    <!-- LOGIN SCREEN (Mobile Optimized) -->
    <div id="login-screen">
        <div class="login-card-mobile">
            <div class="logo-area">
                <div class="logo-box">TF</div>
                <h1>TaskFlow</h1>
            </div>
            <p style="color: #94a3b8; margin-bottom: 20px;">Acesso Mobile</p>
            <div id="login-list" class="mobile-login-list"></div>
            <p id="loading-txt" style="color:var(--primary); display:none; text-align:center;">Conectando...</p>
        </div>
    </div>

    <!-- PASSWORD MODAL -->
    <div class="modal-overlay" id="modal-login-pass" style="z-index: 2000;">
        <div class="modal mobile-modal">
            <div class="modal-header">
                <h3 id="login-user-name">Olá!</h3>
                <button class="btn-close" onclick="closeModal('modal-login-pass')">×</button>
            </div>
            <div class="modal-body">
                <p>Digite sua senha:</p>
                <div class="form-group">
                    <input type="password" id="login-input-pass" class="form-input" placeholder="••••••" inputmode="numeric">
                </div>
                <button class="btn-save full-width" onclick="performLogin()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" style="display:none; flex-direction: column; height: 100vh;">

        <!-- HEADER -->
        <header id="mobile-header">
            <div class="header-left">
                <div class="avatar-small" id="current-avatar">U</div>
                <span id="page-title">Dashboard</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="openCreateModal()">+</button>
                <button class="icon-btn" onclick="logout()">⏻</button>
            </div>
        </header>

        <!-- CONTENT AREA (Scrollable) -->
        <main id="mobile-content">

            <!-- VIEW: DASHBOARD -->
            <div id="view-dash" class="mobile-view active">
                <div class="mobile-dash-grid">
                     <div class="m-card" onclick="switchView('tasks')">
                        <span class="lbl">Pendentes</span>
                        <span class="val" id="dash-todo" style="color:var(--danger)">0</span>
                     </div>
                     <div class="m-card" onclick="switchView('tasks')">
                        <span class="lbl">Em Andamento</span>
                        <span class="val" id="dash-doing" style="color:var(--prio-med)">0</span>
                     </div>
                     <div class="m-card" onclick="switchView('tasks')">
                        <span class="lbl">Concluídas</span>
                        <span class="val" id="dash-done" style="color:var(--prio-low)">0</span>
                     </div>
                </div>
                <div class="chart-area">
                     <h3>Produtividade</h3>
                     <canvas id="chart-weekly-canvas"></canvas>
                </div>
            </div>

            <!-- VIEW: TASKS -->
            <div id="view-tasks" class="mobile-view">
                <div class="tasks-tabs">
                    <button class="tab active" onclick="setTaskTab('todo')">Pendentes</button>
                    <button class="tab" onclick="setTaskTab('doing')">Exec.</button>
                    <button class="tab" onclick="setTaskTab('done')">Feitas</button>
                </div>
                <div id="mobile-task-list" class="mobile-list">
                    <!-- Tasks rendered here -->
                </div>
            </div>

            <!-- VIEW: CHAT -->
            <div id="view-chat" class="mobile-view" style="height:100%; display:flex; flex-direction:column;">
                <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px;"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chat-input" placeholder="Mensagem...">
                    <button onclick="sendChatMessage()">➤</button>
                </div>
            </div>

             <!-- VIEW: SETTINGS -->
             <div id="view-settings" class="mobile-view">
                <h3>Configurações</h3>
                <!-- Simple toggles -->
             </div>

        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav id="bottom-nav">
            <button class="nav-btn active" onclick="switchView('dash')" id="nav-dash">
                <span class="icon">📊</span>
                <span class="label">Dash</span>
            </button>
            <button class="nav-btn" onclick="switchView('tasks')" id="nav-tasks">
                <span class="icon">📋</span>
                <span class="label">Tarefas</span>
            </button>
            <button class="nav-btn" onclick="switchView('chat')" id="nav-chat">
                <span class="icon">💬</span>
                <span class="label">Chat</span>
            </button>
            <button class="nav-btn" onclick="switchView('settings')" id="nav-settings">
                <span class="icon">⚙️</span>
                <span class="label">Ajustes</span>
            </button>
        </nav>

    </div>

    <!-- TASK DETAIL MODAL -->
    <div class="modal-overlay" id="modal-details">
        <div class="modal mobile-modal-full">
            <div class="modal-header">
                <h3 id="detail-title-display">Detalhes</h3>
                <button class="btn-close" onclick="closeModal('modal-details')">×</button>
            </div>
            <div class="modal-body">
                <div id="detail-content"></div> <!-- Populated by JS -->
                 <h4 style="margin-top:20px;">Checklist</h4>
                 <div id="subtask-list"></div>
                 <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="new-subtask-input" class="form-input" placeholder="Nova etapa...">
                    <button class="btn-primary" onclick="addSubtask()">+</button>
                 </div>
            </div>
             <div class="modal-footer">
                <button class="btn-danger-outline" onclick="deleteCurrentTask()">Excluir</button>
            </div>
        </div>
    </div>

    <!-- CREATE MODAL (Simplified) -->
    <div class="modal-overlay" id="modal-create">
        <div class="modal mobile-modal">
             <div class="modal-header"><h3>Nova Tarefa</h3><button class="btn-close" onclick="closeModal('modal-create')">×</button></div>
             <div class="modal-body">
                 <label>Título</label><input type="text" id="input-desc" class="form-input">
                 <label>Prazo</label><input type="date" id="input-date" class="form-input">
                 <label>Resp.</label><select id="input-assignee" class="form-input"></select>
                 <button class="btn-save full-width" style="margin-top:20px;" onclick="saveTask()">Criar</button>
             </div>
        </div>
    </div>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script> <!-- Reusing Login Logic -->

    <!-- We need a specific mobile controller -->
    <script src="js/mobile_ui.js"></script>
    <script src="js/mobile.js"></script>

</body>
</html>
