services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_senha
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    ports:
      - "80:8080"
    environment:
      - DB_HOST=db
      - DB_USER=taskflow
      - DB_PASS=taskflow_senha
      - DB_NAME=taskflow
    volumes:
      - ./frontend/uploads:/app/frontend/uploads
    depends_on:
      - db

volumes:
  postgres_data:
